schema_version: 1
id: csv_success
kind: bar
template: bar.grouped@1.0.0
theme: paper@1.0.0
size:
  width_mm: 120
  height_mm: 75
data:
  source: data/success.csv
  format: csv
encoding:
  x:
    field: task
    order:
    - Task A
    - Task B
  y:
    field: success
    unit: ratio
    domain:
    - 0
    - 1
    format: percent
  series:
    field: method
    order:
    - baseline
    - proposed
labels:
  x: Task
  y: Success rate
options:
  legend_location: upper right
