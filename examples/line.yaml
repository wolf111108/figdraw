# Synthetic demonstration data; not experimental results.
schema_version: 1
id: training_curve
kind: line
template: line.standard@1.0.0
theme: paper@1.0.0
size:
  width_mm: 120
  height_mm: 75
data:
  inline:
  - step: 0
    method: baseline
    score: 0.25
  - step: 25
    method: baseline
    score: 0.4
  - step: 50
    method: baseline
    score: 0.53
  - step: 75
    method: baseline
    score: 0.57
  - step: 100
    method: baseline
    score: 0.65
  - step: 0
    method: proposed
    score: 0.3
  - step: 25
    method: proposed
    score: 0.46
  - step: 50
    method: proposed
    score: 0.6
  - step: 75
    method: proposed
    score: 0.71
  - step: 100
    method: proposed
    score: 0.78
encoding:
  x:
    field: step
  y:
    field: score
    unit: ratio
    domain:
    - 0
    - 1
    format: percent
  series:
    field: method
    order:
    - baseline
    - proposed
labels:
  x: Training steps
  y: Success rate
