[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "figdraw"
version = "0.1.0"
description = "Reproducible, themed scientific charts and hardware diagrams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.10,<4", "pydantic>=2.10,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
diagrams = ["CairoSVG>=2.7,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "build>=1.2,<2"]

[project.scripts]
figdraw = "figdraw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/figdraw"]

[tool.hatch.build.targets.wheel.force-include]
"packages/elk-worker/worker.cjs" = "figdraw/elk_worker/worker.cjs"
"packages/elk-worker/package.json" = "figdraw/elk_worker/package.json"
"packages/elk-worker/package-lock.json" = "figdraw/elk_worker/package-lock.json"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
